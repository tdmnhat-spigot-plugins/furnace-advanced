############################################
#                                          #
#             Furnace Advanced             #
#                                          #
############################################

# This plugin is created by @tdminhnhat.

# This file is used for configuring the plugin. Please make sure that don't put any empty or inconsistent value in this file else the plugin will be not working perfectly, and it maybe causes some errors in your server.
# The configuration for adjusting the message display during game always setup in couple " ". You also can adjust the color code for yourself if you want. The color code should be started the character '&' else they don't work.
# You can take a look all the color code in this website: https://minecraftitemids.com/color-codes

# Config the prefix plugin, every the message is notified the start message always contains the first prefix.
plugin-prefix: "[Furnace Advanced]"

# When the player do an action like executing the command, upgrade, place/break furnace that without permissions. Send them a message to let them know.
not-permissions: "You don't have permission to do this action. Please contact the administrator to get permitted"

# When the player has placed the furnace block, send a message that they can upgrade it if they want.
furnace-place: "You have placed the furnace block. Please hold 'sneaking' button and LEFT CLICK to open the furnace menu"

# When the level generate result which the min and max amount result both different in config.yml. The message replace the Placeholder "%furnaceadvanced_furnace_item_generate%" in the furnace item
range-generate-amount-result: "range %furnaceadvanced_furnace_item_generate_min% to %furnaceadvanced_furnace_item_generate_max% items"

# Config the content each of item on the Overview's menu.
overview-menu:
  title: "Furnace Advanced Menu"
  list-command:
    display-name: "List Commands"
    lore:
      - "/fa help: To see a list commands"
      - "/fa menu: Open a menu Furnace Advanced"
  help-upgrade:
    display-name: "How To Upgrade Furnaces"
    lore:
      - "Step 1: You have to place the furnace block on the ground"
      - "Step 2: SHIFT + LEFT MOUSE on the furnace to open the menu upgrade"
      - "Step 3: Read instruction and choose upgrade"
  menu-furnaces:
    display-name: "Open List Furnaces"
    lore:
      - "Open the furnaces menu to view all the furnaces has been placed on the world. You can teleport to the furnace to get there"

# Config the content each of item on the Furnace's menu
furnace-menu:
  title: "List Your Furnaces"

# Config the amount of the result for cooking ingredient. Here you example:
# generate-result-level:
#   1: --> this describes the level of the generate result. This row of this level "MUST BE A POSITIVE NUMBER"
#     min: 1  --> this describes the minimum amount of the result This value "MUST BE A POSITIVE NUMBER AND SMALLER THAN MAX"
#     max: 4  --> this describes the maximum amount of the result. If you set the value equal the min, it means the amount of the result will be generated exactly that value after cooking done. This value "MUST BE A POSITIVE NUMBER AND GREATER THAN MIN"
generate-result-level:
  1:
    min: 1
    max: 1
  2:
    min: 1
    max: 2
  3:
    min: 1
    max: 4
  4:
    min: 2
    max: 6
  5:
    min: 3
    max: 8

# Config the furnace level. Here your example:
# level:
#   1: --> this describes the level the cooking time. This row of this level "MUST BE A POSITIVE NUMBER"
#     cookTime: 10  --> this describes that the time which cooks the ingredient is 10 seconds. This value "MUST BE A POSITIVE NUMBER"
cook-level:
  1:
    cookTime: 10
  2:
    cookTime: 9
  3:
    cookTime: 7
  4:
    cookTime: 5
  5:
    cookTime: 3
