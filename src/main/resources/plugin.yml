name: FurnaceAdvanced
description: $description
version: '${version}'

main: dev.tdmnhat.plugin.spigot.FurnaceAdvanced
api-version: '1.13'

authors: [ tdminhnhat ]

permissions:
  furnaceadvanced.admin.*:
    description: Access all the admin actions. This includes all the permission from player
    default: not op
    children:
      furnaceadvanced.player.*: true

  furnaceadvanced.player.*:
    description: Access all the player actions. But the admin actions are not permitted
    default: not op
    children:
      furnaceadvanced.player.breakfurnace-other: true

  furnaceadvanced.player.breakfurnace-other:
    description: Allow the player can break the other's furnace. The information from that
    default: not op

