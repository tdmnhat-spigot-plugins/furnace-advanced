name: Publish New Version
on:
  pull_request:
    branches: [ "main" ]
jobs:
  checkout-project:
    permissions:
      contents: write
      pull-requests: write
      checks: write
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build Project With Maven
        run: mvn -B clean package

      - name: Get Version From File Jar
        id: get-version
        run: |
          JAR=$(ls target/*.jar | grep -v -E '(sources|javadoc|original)' | head -n 1)
          VERSION=$(unzip -p "$JAR" plugin.yml | grep -m1 '^version:' | sed -E "s/^version:[[:space:]]*['\"]?([^'\"]+)['\"]?.*/\1/")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set Version in Environment Variable
        run: |
          echo "Building version: $VERSION"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Upload Jar
        uses: actions/upload-artifact@v7.0.2
        with:
          name: app-jar
          path: target/*.jar

  release-version:
    needs: checkout-project
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.checkout-project.outputs.version }}
    steps:
      - name: Download Jar
        uses: actions/download-artifact@v8.0.2
        with:
          name: app-jar
          path: dist

      - name: Create Tag With Version In Variable Environment
        run: |
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"
          if gh api "repos/${{ github.repository }}/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists. Bump the version in pom.xml."
            exit 1
          fi
          gh api "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/v$VERSION" \
            -f sha="${{ github.sha }}"

      - name: Release Version
        run: |
          gh release create "$RELEASE_TAG" dist/*.jar \
            --repo "${{ github.repository }}" \
            --title "$RELEASE_TAG" \
            --generate-notes